version: 0.2

env:
  variables:
    AWS_REGION: us-east-1

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - $(aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin 044519418214.dkr.ecr.us-east-1.amazonaws.com)
      - REPOSITORY_URI=044519418214.dkr.ecr.us-east-1.amazonaws.com/delfood
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t 
      - docker tag delfood:latest 044519418214.dkr.ecr.us-east-1.amazonaws.com/delfood:latest

  post_build:
    commands:
      - echo Pushing the Docker image...
      - docker push $docker push 044519418214.dkr.ecr.us-east-1.amazonaws.com/delfood:latest
     

artifacts:
  files: '**/*'
