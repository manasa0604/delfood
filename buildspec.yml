version: 0.2

env:
  variables:
    AWS_REGION: us-east-1  # Change if you're using a different region

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - $(aws ecr get-login-password --region $us-east-1 | docker login --username AWS --password-stdin $044519418214.dkr.ecr.$us-east-1.amazonaws.com)
      - REPOSITORY_URI=$044519418214.dkr.ecr.$us-east-1.amazonaws.com/delfood
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
  build:
    commands:
      - echo Building the Docker image...
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest
  post_build:
    commands:
      - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest

artifacts:
  files: '**/*'
